{{- /* monitoring.grafana.dashboards wins; legacy grafana.* kept as fallback for one release. */ -}}
{{- $legacyEnabled := and .Values.grafana.enabled .Values.grafana.dashboards.enabled -}}
{{- if or .Values.monitoring.grafana.dashboards.enabled $legacyEnabled }}
{{- $dashboardLabel := .Values.monitoring.grafana.dashboards.dashboardLabel | default .Values.grafana.sidecar.dashboardLabel | default "grafana_dashboard" }}
{{- $dashboardLabelValue := .Values.monitoring.grafana.dashboards.dashboardLabelValue | default .Values.grafana.sidecar.dashboardLabelValue | default "1" }}
{{- $dashboardFolder := .Values.monitoring.grafana.dashboards.dashboardFolder | default .Values.grafana.sidecar.dashboardFolder }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "minato.fullname" . }}-grafana-dashboard-overview
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minato.labels" . | nindent 4 }}
    {{ $dashboardLabel }}: {{ $dashboardLabelValue | quote }}
    {{- with .Values.monitoring.grafana.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $dashboardFolder }}
    grafana_dashboard_folder: {{ . | quote }}
    {{- end }}
data:
  minato-overview.json: |
    {{ .Files.Get "dashboards/minato-overview.json" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "minato.fullname" . }}-grafana-dashboard-servers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minato.labels" . | nindent 4 }}
    {{ $dashboardLabel }}: {{ $dashboardLabelValue | quote }}
    {{- with .Values.monitoring.grafana.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $dashboardFolder }}
    grafana_dashboard_folder: {{ . | quote }}
    {{- end }}
data:
  minato-servers.json: |
    {{ .Files.Get "dashboards/minato-servers.json" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "minato.fullname" . }}-grafana-dashboard-fleet
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minato.labels" . | nindent 4 }}
    {{ $dashboardLabel }}: {{ $dashboardLabelValue | quote }}
    {{- with .Values.monitoring.grafana.dashboards.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $dashboardFolder }}
    grafana_dashboard_folder: {{ . | quote }}
    {{- end }}
data:
  minato-fleet.json: |
    {{ .Files.Get "dashboards/minato-fleet.json" | nindent 4 }}
{{- end }}
