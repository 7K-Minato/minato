name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      helm: ${{ steps.filter.outputs.helm }}
      proto: ${{ steps.filter.outputs.proto }}
      docker: ${{ steps.filter.outputs.docker }}
      openapi: ${{ steps.filter.outputs.openapi }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
            helm:
              - 'deploy/helm/**'
            proto:
              - 'proto/**'
              - 'buf.yaml'
              - 'buf.gen.yaml'
            docker:
              - 'Dockerfile'
              - '**/Dockerfile'
              - '.dockerignore'
            openapi:
              - 'api/openapi.yaml'

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    uses: ./.github/workflows/reusable-lint.yml
    with:
      check-generated: true

  unit-tests:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    uses: ./.github/workflows/reusable-test.yml

  integration-tests:
    needs: changes
    if: ${{ needs.changes.outputs.go == 'true' }}
    uses: ./.github/workflows/reusable-integration-test.yml

  helm-check:
    needs: changes
    if: ${{ needs.changes.outputs.helm == 'true' }}
    uses: ./.github/workflows/reusable-helm.yml

  proto-check:
    needs: changes
    if: ${{ needs.changes.outputs.proto == 'true' }}
    uses: ./.github/workflows/reusable-proto.yml

  openapi-check:
    needs: changes
    if: ${{ needs.changes.outputs.openapi == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout (base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false

      - name: Check for breaking OpenAPI changes
        run: |
          docker run --rm -v ${{ github.workspace }}:/specs \
            tufin/oasdiff:latest \
            breaking /specs/base/api/openapi.yaml /specs/api/openapi.yaml

  build-binaries:
    needs: [lint, unit-tests]
    if: ${{ needs.changes.outputs.go == 'true' }}
    uses: ./.github/workflows/reusable-build.yml

  build-images:
    needs: [lint, unit-tests]
    if: ${{ needs.changes.outputs.go == 'true' || needs.changes.outputs.docker == 'true' }}
    uses: ./.github/workflows/reusable-build-images.yml
