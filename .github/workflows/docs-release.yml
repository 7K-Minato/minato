name: "Release: Docs"

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs-release.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-site
          path: site/
          retention-days: 7

  publish:
    needs: build
    uses: 7K-Group/workflows-library/.github/workflows/release-docs.yml@8f3f1dd841f9f34fc74a5fdb76577119b251ec0c # v1
    with:
      path: site
      version: ${{ github.sha }}
      prefix: minato
      artifact: docs-site
    secrets:
      DOCS_S3_ACCESS_KEY_ID: ${{ secrets.DOCS_S3_ACCESS_KEY_ID }}
      DOCS_S3_SECRET_ACCESS_KEY: ${{ secrets.DOCS_S3_SECRET_ACCESS_KEY }}
      APPDOCS_S3_BUCKET: ${{ secrets.APPDOCS_S3_BUCKET }}
      DOCS_S3_ENDPOINT_URL: ${{ secrets.DOCS_S3_ENDPOINT_URL }}
