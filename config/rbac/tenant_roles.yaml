# Tenant-facing ClusterRoles for human access via kubectl.
# These are NOT used by the control plane or operator; bind them per tenant
# namespace with RoleBindings, e.g.:
#   kubectl create rolebinding tenant-alpha-operator \
#     --clusterrole=minato:tenant-operator --user=tenant-alpha@example.com \
#     --namespace=tenant-alpha
# See docs/operations/multi-tenancy.md.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: minato:tenant-viewer
  labels:
    app.kubernetes.io/part-of: minato
    minato.io/aggregate-to-tenant-operator: "true"
rules:
  # Read-only access to all Minato resources in the bound namespace.
  - apiGroups: ["operator.minato.io"]
    resources: ["gameservers", "gameserverfleets", "actionexecutions", "gamesnapshots", "gameprofiles"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: minato:tenant-operator
  labels:
    app.kubernetes.io/part-of: minato
    minato.io/aggregate-to-tenant-admin: "true"
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        minato.io/aggregate-to-tenant-operator: "true"
rules:
  # Create and manage GameServers and ActionExecutions.
  # GameProfiles remain platform-managed (read-only, inherited from viewer).
  - apiGroups: ["operator.minato.io"]
    resources: ["gameservers", "actionexecutions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: minato:tenant-admin
  labels:
    app.kubernetes.io/part-of: minato
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        minato.io/aggregate-to-tenant-admin: "true"
rules:
  # Full access to the remaining Minato resources in the bound namespace.
  - apiGroups: ["operator.minato.io"]
    resources: ["gameserverfleets", "gamesnapshots"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Full access within the namespace, including managing NetworkPolicies.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: minato:platform-admin
  labels:
    app.kubernetes.io/part-of: minato
rules:
  # Manage the cluster-wide shared game catalog.
  - apiGroups: ["operator.minato.io"]
    resources: ["gameprofiles"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Visibility into tenant namespaces for fleet-wide operations.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
